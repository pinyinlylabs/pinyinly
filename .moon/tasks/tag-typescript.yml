inheritedBy:
  tag: typescript

tasks:
  typecheck:
    command: tsgo --build
    inputs:
      - "!dist/"
      - "!node_modules/"
      - "*.{ts,cts,mts,tsx,mtsx,js,cjs,mjs,json}"
      - "**/*.{ts,cts,mts,tsx,mtsx,js,cjs,mjs,json}"
      - /tsconfig.base.json
      - /yarn.lock
    toolchains: "node"
    tags:
      - ci
