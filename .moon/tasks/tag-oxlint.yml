tasks:
  oxlint:
    description: "Run Oxlint for fast linting"
    script: |
      [ -z ${CI:-} ] && FIX_FLAG="--fix"

      oxlint --deny-warnings --type-aware ${FIX_FLAG:-} .
    inputs:
      - "**/*.{cjs,js,mjs,ts,tsx}"
      - "*.{cjs,js,mjs,ts,tsx}"
      - ".oxlintrc.*"
      - "/projects/oxlint-rules/*.oxlintrc.*"
    env:
      # Pass $NODE_OPTIONS to support VS Code "JavaScript Debug Terminal".
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS
    toolchain: "node"
