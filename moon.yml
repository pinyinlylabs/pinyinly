id: root

fileGroups:
  yarnConfig:
    - ".yarnrc.yml"
    - "package.json"
    - "projects/*/package.json"
    - "yarn.config.cjs"
    - "yarn.lock"

tasks:
  yarnConstraints:
    script: |
      [ -z ${CI:-} ] && FIX_FLAG="--fix"

      yarn constraints ${FIX_FLAG:-}
    inputs:
      - "@group(yarnConfig)"
      - "projects/app/api/package.json"
      - "projects/app/api/pnpm-lock.yaml"
      # Environment variables
      - "$CI"
    env:
      NODE_OPTIONS: --import tsx --disable-warning=ExperimentalWarning $NODE_OPTIONS

  yarnDedupe:
    tags:
      - ci-daily
    script: |
      [ -z ${CI:-} ] || CHECK_FLAG="--check"

      yarn dedupe ${CHECK_FLAG:-}
    inputs:
      - "@group(yarnConfig)"
      - "$CI"
    env:
      NODE_OPTIONS: --import tsx --disable-warning=ExperimentalWarning $NODE_OPTIONS

  renovateCheck:
    command: yarn dlx -p renovate@43.150.0 renovate-config-validator --strict
    inputs:
      - renovate.json5

  test:
    tags:
      - ci
    deps:
      - renovateCheck
      - yarnConstraints

  fmt:
    tags:
      - ci
    deps:
      - ~:oxfmt

tags:
  - oxfmt
  - typescript
