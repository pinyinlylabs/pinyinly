# Example usage:
#
# steps:
#   - uses: ./.github/actions/moon-affected
#     id: moon-deploy-query
#     with:
#       target: app:deploy
#
#   - run: yarn install
#     if: steps.moon-deploy-query.outputs.target-affected == 'true'
#
#   - run: moon run app:deploy --color
#     if: steps.moon-deploy-query.outputs.target-affected == 'true'

name: moon-affected
description: Query Moon's affected tasks including transitive dependents
inputs:
  target:
    description: Moon task ID, e.g. app:deploy
    required: true
    default: ""
outputs:
  target-affected:
    description: Boolean result of whether the target is affected
    value: ${{ steps.moon-query.outputs.match == inputs.target }}
runs:
  using: composite
  steps:
    - id: moon-query
      run: |
        ALL_AFFECTED=$(moon query tasks --affected --downstream=deep | jq '.tasks.[].[].target')
        echo "ALL_AFFECTED=$ALL_AFFECTED"
        MATCH=$(echo "$ALL_AFFECTED" | jq --raw-output --arg target "$TARGET" 'select(. == $target)')
        echo "match=$MATCH"
        echo "match=$MATCH" >> "$GITHUB_OUTPUT"
      env:
        TARGET: ${{ inputs.target }}
      shell: bash

    - name: Log match output
      run: |
        echo "Match output: ${{ steps.moon-query.outputs.match }}"
      shell: bash

    - name: Log target input
      run: |
        echo "Target input: ${{ inputs.target }}"
      shell: bash

    - name: Check if target is affected
      id: target-affected
      run: |
        echo "Target affected: ${{ steps.moon-query.outputs.match == inputs.target }}"
      shell: bash
