name: Install test tools
description: Install test dependencies after setup-tools.

runs:
  using: composite
  steps:
    - name: Install Chromium (for browser tests)
      run: yarn workspace @pinyinly/app exec playwright install --with-deps --only-shell chromium
      shell: bash

    - name: Install ffmpeg (for tests)
      # Installing from a static build is dramatically faster than using apt-get.
      run: |
        tar -xf ffmpeg-release-i686-static.tar.xz
        echo "${PWD}"/ffmpeg-*-static >> "${GITHUB_PATH}"
      shell: bash
      working-directory: .github/actions/setup-test-tools
