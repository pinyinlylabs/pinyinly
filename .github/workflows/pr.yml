name: PR

on:
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: app-preview-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            app:
              - '.github/actions/app-preview/**'
              - '.github/workflows/pr.yml'
              - '.github/actions/setup-tools/**'
              - '.github/actions/metro-cache/**'
              - '.moon/**'
              - '.prototools'
              - '.yarnrc.yml'
              - '.yarn/patches/**'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'yarn.lock'
              - 'projects/app/moon.yml'
              - 'projects/app/package.json'
              - 'projects/app/app.config.js'
              - 'projects/app/babel.config.cjs'
              - 'projects/app/metro.config.cjs'
              - 'projects/app/postcss.config.mjs'
              - 'projects/app/tsconfig*.json'
              - 'projects/app/vercel.json'
              - 'projects/app/.vercelignore'
              - 'projects/app/bin/dbMigrate.ts'
              - 'projects/app/drizzle.config.ts'
              - 'projects/app/.env.local.sample'
      - name: 🏗 Clone repo
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - uses: ./.github/actions/app-preview
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true'
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ secrets.NEON_PROJECT_ID }}
          neon-username: ${{ secrets.NEON_USERNAME }}
          assets-cdn-base-url: ${{ secrets.EXPO_PUBLIC_ASSETS_CDN_BASE_URL }}
          posthog-api-key: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          sentry-dsn: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_APP }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}

  static-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: static-preview-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            static:
              - '.github/actions/static-preview/**'
              - '.github/workflows/pr.yml'
              - '.github/actions/setup-tools/**'
              - '.moon/**'
              - '.prototools'
              - '.yarnrc.yml'
              - '.yarn/patches/**'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'yarn.lock'
              - 'projects/static/moon.yml'
              - 'projects/static/package.json'
              - 'projects/static/vercel.json'

      - name: 🏗 Clone repo
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.static == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - uses: ./.github/actions/static-preview
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.static == 'true'
        with:
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_STATIC }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}

  moon-ci:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STATIC }}
    steps:
      - name: 🏗 Clone repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - uses: ./.github/actions/setup-tools

      - uses: ./.github/actions/metro-cache

      - run: moon run ':#ci' --color --affected
        env:
          # Exclude wiki content during CI builds to avoid bundling 3000+ MDX files.
          # Wiki is lazy-loaded, so users won't be affected—preview will just show no wiki.
          PYLY_SLIM_WIKI_FOR_TESTING: "true"

      - name: 🧾 Results
        uses: bradleyayers/moon-ci-retrospect@main
        if: ${{ always() }}
