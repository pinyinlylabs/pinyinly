name: PR

on:
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      static: ${{ steps.filter.outputs.static }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            app:
              - '.github/workflows/app-preview.yml'
              - '.github/workflows/ci-daily.yml'
              - '.github/workflows/pr.yml'
              - '.github/actions/setup-tools/**'
              - '.github/actions/metro-cache/**'
              - '.moon/**'
              - '.prototools'
              - '.yarnrc.yml'
              - '.yarn/patches/**'
              - 'package.json'
              - 'yarn.lock'
              - 'projects/app/moon.yml'
              - 'projects/app/package.json'
              - 'projects/app/app.config.js'
              - 'projects/app/babel.config.cjs'
              - 'projects/app/metro.config.cjs'
              - 'projects/app/postcss.config.mjs'
              - 'projects/app/tsconfig*.json'
              - 'projects/app/vercel.json'
              - 'projects/app/.vercelignore'
              - 'projects/app/bin/dbMigrate.ts'
              - 'projects/app/drizzle.config.ts'
              - 'projects/app/.env.local.sample'
            static:
              - '.github/workflows/static-preview.yml'
              - '.github/workflows/ci-daily.yml'
              - '.github/workflows/pr.yml'
              - '.github/actions/setup-tools/**'
              - '.moon/**'
              - '.prototools'
              - '.yarnrc.yml'
              - '.yarn/patches/**'
              - 'package.json'
              - 'yarn.lock'
              - 'projects/static/moon.yml'
              - 'projects/static/package.json'
              - 'projects/static/vercel.json'

  app-preview:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app-preview.yml
    secrets: inherit

  static-preview:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.static == 'true'
    uses: ./.github/workflows/static-preview.yml
    secrets: inherit

  moon-ci:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STATIC }}
    steps:
      - name: 🏗 Clone repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - uses: ./.github/actions/setup-tools

      - uses: ./.github/actions/metro-cache

      - run: moon run ':#ci' --color --affected
        env:
          # Exclude wiki content during CI builds to avoid bundling 3000+ MDX files.
          # Wiki is lazy-loaded, so users won't be affected—preview will just show no wiki.
          PYLY_SLIM_WIKI_FOR_TESTING: "true"

      - name: 🧾 Results
        uses: bradleyayers/moon-ci-retrospect@main
        if: ${{ always() }}
