name: CI (daily)

on:
  schedule:
    # Run at 7 AM AEST, some tests check if packages are up to date (e.g. `expo
    # doctor`). Without a schedule then random pull requests can fail.
    - cron: 0 17 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moon-ci:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Clone repo
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-tools

      - run: moon run ':#ci' ':#ci-daily' --color

      - name: 🧾 Results
        uses: bradleyayers/moon-ci-retrospect@main
        if: ${{ always() }}
