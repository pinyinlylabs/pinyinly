fileGroups:
  emails:
    - "emails/**/*"
    - "*.json"

tasks:
  dev:
    command: yarn email dev
    preset: server

  build:
    command: yarn email build
    inputs:
      - "@group(emails)"
    # Not tagged `ci` until https://github.com/fb55/css-select/issues/1590 is resolved.

  start:
    command: yarn email start
    deps:
      - build
    preset: server

  fmt:
    tags:
      - ci
    deps:
      - ~:oxfmt

tags:
  - oxfmt
