fileGroups:
  sentryCliEnv:
    - $SENTRY_*
  expoCliEnv:
    - "$EXPO_*"
    - "$PYLY_*"
  # WARNING: these must end in trialing slash to be rsync
  buildVercelExpoOutdir:
    - dist/.cache/vercel-expo/
  buildVercelExpoSentryOutdir:
    - dist/.cache/vercel-expo-sentry/
  buildVercelOutdir:
    - dist/vercel/
  buildEasUpdateOutdir:
    - dist/eas/

toolchain:
  default: "node"

workspace:
  inheritedTasks:
    rename:
      deploy: "deployVercelVercel"

tasks:
  build:
    deps:
      - ~:buildEasUpdate
      - ~:buildVercel
    options:
      runInCI: false

  buildIosDevClient:
    script: expo run:ios
    options:
      runInCI: false
      cache: false
    toolchain: "node"

  buildAndroidDevClient:
    script: expo run:android
    options:
      runInCI: false
      cache: false
    toolchain: "node"

  buildEasUpdate:
    # Do iOS and Android separately to avoid IO contention and maybe allow metro bundler cache re-use.
    script: |
      expo export -p ios --source-maps --output-dir @group(buildEasUpdateOutdir)
      expo export -p android --source-maps --output-dir @group(buildEasUpdateOutdir)
    deps:
      - ~:codegen
    env:
      NODE_OPTIONS: --import tsx --disable-warning=ExperimentalWarning $NODE_OPTIONS
    options:
      envFile: .env.local
      mutex: expo-export # reduce IO contention
    outputs:
      - "@group(buildEasUpdateOutdir)"
    toolchain: "node"

  buildVercel:
    # Copy to final destination.
    command: rsync -a --delete @group(buildVercelExpoSentryOutdir) @group(buildVercelOutdir)
    deps:
      - ~:buildVercelExpoSentry
    outputs:
      - "@group(buildVercelOutdir)"

  buildVercelExpo:
    script: |
      mkdir -p @group(buildVercelExpoOutdir) &&
      rm -rf @group(buildVercelExpoOutdir) &&
      expo export -p web --source-maps --output-dir @group(buildVercelExpoOutdir)
    deps:
      - ~:codegen
    inputs:
      - "@group(expoCliEnv)"
      - "*.*"
      - "{api,assets,public,src}/**/*"
    options:
      envFile: .env.local
      internal: true
      mutex: expo-export # reduce IO contention
    outputs:
      - "@group(buildVercelExpoOutdir)"
    env:
      NODE_OPTIONS: --import tsx --disable-warning=ExperimentalWarning $NODE_OPTIONS
    toolchain: "node"

  buildVercelExpoSentry:
    script: |
      rsync -a --delete @group(buildVercelExpoOutdir) @group(buildVercelExpoSentryOutdir) &&
      npx -y @sentry/cli@3.4.1 sourcemaps inject @group(buildVercelExpoSentryOutdir)
    deps:
      - ~:buildVercelExpo
    inputs:
      - "@group(sentryCliEnv)"
    options:
      internal: true
    outputs:
      - "@group(buildVercelExpoSentryOutdir)"

  buildBillOfMaterials:
    script: |
      expo export &&
      tsx --tsconfig tsconfig.node.json ./bin/buildBillOfMaterials.ts
    preset: watcher
    options:
      envFile: .env.local
      mutex: expo-export # reduce IO contention
    env:
      EXPO_ATLAS: "true"
      NODE_OPTIONS: --import tsx --disable-warning=ExperimentalWarning $NODE_OPTIONS
    toolchain: "node"

  codegen:
    deps:
      - ~:codegenExpoRouterTypes
      - ~:codegenOxlint
      - ~:codegenPublicVendor
      - ~:codegenUniwind

  codegenOxlint:
    description: "Run Oxlint with codegen rules. This is separate from lint and doesn't use Oxlint caching intentionally."
    script: |
      [ -n "${CI:-}" ] && {
        echo -e "\033[33m⚠️  CI environment detected, skipping execution.\033[0m"
        exit 0
      }

      oxlint --config oxlint-codegen.config.ts --fix .
    inputs:
      # Config files anywhere within the project
      - src/data/pinyinSoundAudio.ts
      - src/client/ui/iconRegistry.ts
      - src/**/*.demo.tsx
      - src/assets/**
      - oxlint-codegen.config.ts
      # Environment variables
      - "$DEBUG"
    deps:
      - oxlint-rules:src
    env:
      # Pass $NODE_OPTIONS to support VS Code "JavaScript Debug Terminal".
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS
    toolchain: "node"

  codegenExpoRouterTypes:
    # The recommended command from https://docs.expo.dev/router/reference/typed-routes/#type-generation
    command: expo customize tsconfig.json
    inputs:
      - "@group(expoCliEnv)"
      - "*.*"
      - "{public,src/app}/**/*"
    env:
      # Fixes: (node:97180) Warning: To load an ES module, set "type": "module"
      # in the package.json or use the .mjs extension.
      #
      # Pass $NODE_OPTIONS to support VS Code "JavaScript Debug Terminal".
      NODE_OPTIONS: --import tsx --disable-warning=ExperimentalWarning $NODE_OPTIONS
    toolchain: "node"

  codegenPublicVendor:
    command: tsx --tsconfig tsconfig.node.json ./bin/codegenPublicVendor.ts
    options:
      envFile: .env.local
    env:
      NODE_OPTIONS: --import tsx --disable-warning=ExperimentalWarning $NODE_OPTIONS
    toolchain: "node"
    outputs:
      - "public/vendor/**/*"

  codegenUniwind:
    # The recommended command from https://docs.uniwind.dev/api/generate-artifacts
    # Keep in sync between vitest.browser.config.ts + moon.yml + metro.config.cjs
    command: |
      uniwind generate-artifacts
        --css ./src/global.css 
        --dts ./uniwind-env.d.ts
        --theme dark-danger-panel
        --theme dark-grass-panel
        --theme dark-placeholder-panel
        --theme dark-popover
        --theme dark-sky-panel
        --theme dark-success-panel
        --theme dark-warning-panel
        --theme dark
        --theme light-danger-panel
        --theme light-grass-panel
        --theme light-placeholder-panel
        --theme light-popover
        --theme light-sky-panel
        --theme light-success-panel
        --theme light-warning-panel
        --theme light
    inputs:
      - "/yarn.lock"
    toolchain: "node"

  dbCheck:
    command: drizzle-kit check
    description: |
      Check the database schema for consistency, also makes sure the version of
      `drizzle-kit` and `drizzle-orm` are compatible.

  dbGenerate:
    command: drizzle-kit generate
    preset: watcher

  dbMigrate:
    command: tsx --tsconfig tsconfig.node.json ./bin/dbMigrate.ts
    preset: watcher
    options:
      envFile: .env.local
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS

  deploy:
    deps:
      - ~:deployEasUpdate
      - ~:deployVercel
    options:
      runInCI: false

  deployEasUpdate:
    deps:
      - ~:deployEasUpdateEas
      - ~:deployEasUpdateSentry
    options:
      persistent: false
      runInCI: false

  deployEasUpdateEas:
    command: npx -y eas-cli@18.11.0 update --skip-bundler --input-dir @group(buildEasUpdateOutdir) --auto --non-interactive
    deps:
      - ~:buildEasUpdate
    options:
      persistent: false
      runInCI: false

  deployEasUpdateSentry:
    command: npx -y sentry-expo-upload-sourcemaps @group(buildEasUpdateOutdir)
    deps:
      - ~:buildEasUpdate
    options:
      persistent: false
      runInCI: false

  deployVercel:
    deps:
      - ~:deployVercelVercel
      - ~:deployVercelSentry
    options:
      persistent: false
      runInCI: false

  deployVercelVercel:
    deps:
      - ~:buildVercel

  deployVercelSentry:
    command: npx -y @sentry/cli@3.4.1 sourcemaps upload -o pinyinly -p app @group(buildVercelOutdir)
    deps:
      - ~:buildVercel
    options:
      persistent: false
      runInCI: false

  dev:
    command: noop
    deps:
      - ~:devExpo
      - ~:devServices
    preset: server

  devServices:
    command: noop
    deps:
      - ~:devInngest
      - ~:devMinio
    preset: server

  devExpo:
    command: expo start
    preset: watcher
    options:
      # There's a memory leak that causes it to crash after a while, so we just
      # restart it.
      retryCount: 100
    env:
      # Fixes: (node:97180) Warning: To load an ES module, set "type": "module"
      # in the package.json or use the .mjs extension.
      #
      # Pass $NODE_OPTIONS to support VS Code "JavaScript Debug Terminal".
      NODE_OPTIONS: --import tsx --disable-warning=ExperimentalWarning $NODE_OPTIONS
    toolchain: "node"

  devInngest:
    command: npx -y inngest-cli@1.39.0 dev
    preset: watcher

  devMinio:
    command: minio server ./.minio --console-address :9001 --license ~/minio/minio.license
    preset: watcher
    env:
      MINIO_ROOT_USER: miniodev
      MINIO_ROOT_PASSWORD: miniodev

  dictionary:
    command: tsx --tsconfig tsconfig.node.json ./bin/dictionary.tsx
    preset: watcher
    options:
      envFile: .env.local
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS

  expoAtlas:
    script: |
      expo export -p web &&
      npx expo-atlas .expo/atlas.jsonl
    preset: watcher
    options:
      envFile: .env.local
      mutex: expo-export # reduce IO contention
    env:
      EXPO_ATLAS: "true"
      NODE_OPTIONS: --import tsx --disable-warning=ExperimentalWarning $NODE_OPTIONS

  generateHskWordlist:
    command: tsx --tsconfig tsconfig.node.json ./bin/generateHskWordlist.ts
    preset: watcher
    options:
      envFile: .env.local
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS

  generateMissingFontGlyphs:
    command: tsx --tsconfig tsconfig.node.json ./bin/generateMissingFontGlyphs.ts
    preset: watcher
    options:
      envFile: .env.local
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS

  generateMnemonicTheme:
    command: tsx --tsconfig tsconfig.node.json ./bin/generateMnemonicTheme.ts
    preset: watcher
    options:
      envFile: .env.local
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS

  generateRadicalNameMnemonics:
    command: tsx --tsconfig tsconfig.node.json ./bin/generateRadicalNameMnemonics.ts
    preset: watcher
    options:
      envFile: .env.local
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS

  generateWikiCharacterStrokes:
    command: tsx --tsconfig tsconfig.node.json ./bin/generateWikiCharacterStrokes.ts
    preset: watcher
    options:
      envFile: .env.local
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS

  generateSpeech:
    command: tsx --tsconfig tsconfig.node.json ./bin/generateSpeech.ts
    preset: watcher
    options:
      envFile: .env.local
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning $NODE_OPTIONS

  expoDoctor:
    command: npx -y expo-doctor@1.20.0
    deps:
      - ~:codegen
    options:
      # This checks the latest version of dependencies from the internet, so it
      # can't cache purely off local filesystem. It's important cache is
      # disabled otherwise the daily CI won't run this.
      cache: false
      # Expo doctor checks that the latest version of dependencies are used,
      # which means that it can start failing due to upstream Expo changes even
      # if nothing in the repo has broken. To avoid this breaking CI and causing
      # noise it's run in a separate Github action workflow.
      runInCI: false

  test:
    deps:
      - ~:codegen
      - audio-sprites:src
    outputs:
      - "src/assets/audio/manifest.json"
      - "src/assets/audio/sprites/*.m4a"
    options:
      envFile:
        - .env.test.local

  browser:
    deps:
      - ~:codegen
    options:
      envFile:
        - .env.test.local

  evals:
    deps:
      - ~:codegen
    options:
      envFile:
        - .env.test.local

  typecheck:
    deps:
      - ~:codegen

  lint:
    deps:
      - ~:oxlint

  oxlint:
    deps:
      # Lint does type-checking, so the Expo router types need to be generated first.
      - ~:codegen

  fmt:
    deps:
      - ~:oxfmt

tags:
  - oxfmt
  - oxlint
  - typescript
  - vercel
  - vitest
  - vitest-bench
  - vitest-browser
  - vitest-evals

dependsOn:
  - audio-sprites
  - lib
  - mdx
  - oxlint-rules
